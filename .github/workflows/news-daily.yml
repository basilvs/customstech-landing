name: news-daily

on:
  schedule:
    - cron: "45 6 * * *" # 09:45 МСК
  workflow_dispatch:

concurrency:
  group: news-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Build feed
        env:
          PROXYAPI_API_KEY: ${{ secrets.PROXYAPI_API_KEY }}
        run: |
          echo "::add-mask::${PROXYAPI_API_KEY}"
          cd scripts
          python -m newsfeed.build \
            --sources sources.yaml \
            --state ../data/state.json \
            --out ../news.json \
            --js ../news-data.js \
            --limit 30 --window-days 90 --max-new 10 \
            --llm-timeout 30

      - name: Detect changes
        id: changes
        run: |
          if git diff --exit-code --quiet -- news.json news-data.js data/state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload news.json to customstech.ru
        if: steps.changes.outputs.changed == 'true'
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}
          FTP_PORT: "21"
        run: sh scripts/ftp-upload.sh news.json news.json

      - name: Commit state + feed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json news-data.js data/state.json
          git commit -m "news feed update $(date -u +%Y-%m-%d)"
          git push